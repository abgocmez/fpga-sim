# --- Pmod ports ---------------------------------------------------------------
# VERIFY: port count, which of JA..JE are PL and which share XADC pins, and the
# MIO assignment of JF. Signal pins are named <id>1..4 and <id>7..10 as on a
# standard 12-pin Pmod.
[[pmods]]
id = "JA"
domain = "pl"
x = 100
y = 46

[[pmods]]
id = "JB"
domain = "pl"
x = 250
y = 46

[[pmods]]
