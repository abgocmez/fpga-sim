# Digilent Zybo Z7-20 (XC7Z020-1CLG400C) board description.
#
# Layout coordinates are in a 1000 x 640 drawing space, origin top-left, y down.
# Every entry's x,y is its CENTRE. The drawing is schematic and NOT to scale; it
# is not a photograph of the physical board layout.
#
# VERIFY: every package pin below is transcribed from memory of the Digilent
# Zybo-Z7-Master.xdc and has NOT been checked against the Zybo Z7 Reference
# Manual / schematic. Pmod pin locations are deliberately omitted until checked.
# `pin_status` is surfaced by `zynqsim inspect` and the MCP `status_get` tool.

schema_version = 1
name = "zybo-z7-20"
display_name = "Digilent Zybo Z7-20"
part = "xc7z020clg400-1"
ddr_mb = 1024              # 1 GB DDR3L; VERIFY against the reference manual
pl_clock_hz = 125000000    # VERIFY: 125 MHz PL oscillator
ps_clock_hz = 33333333     # VERIFY: 33.33 MHz PS clock
pin_status = "unverified"

[layout]
width = 1000
height = 640

# VERIFY: XC7Z020 resources (Zynq-7000 datasheet DS190), from memory.
[resources]
luts = 53200
flip_flops = 106400
bram_36k = 140
dsp_slices = 220

