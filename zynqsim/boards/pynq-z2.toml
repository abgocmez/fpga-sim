# TUL PYNQ-Z2 (XC7Z020-1CLG400C) board description.
#
# Layout coordinates are in a 1000 x 640 drawing space, origin top-left, y down.
# Every entry's x,y is its CENTRE. The drawing is schematic and NOT to scale; it
# is not a photograph of the physical board layout.
#
# EVERYTHING in this file is from memory of the PYNQ-Z2 reference manual and the
# TUL PYNQ-Z2 master XDC; none of it has been checked against the documents.
#
# VERIFY: part xc7z020clg400-1, 512 MB DDR3 (ddr_mb = 512), 125 MHz PL clock (pin H16),
#         50 MHz PS clock.
# VERIFY: 2 slide switches (SW0, SW1), 4 push buttons (BTN0..BTN3), 4 user LEDs
#         (LD0..LD3), 2 RGB LEDs (LD4, LD5) and every package pin below. The board's
#         reset button and the PS-side LEDs/buttons are not modelled.
# VERIFY: Pmod ports PMODA and PMODB (the Arduino shield header and the Raspberry
#         Pi header are drawn only; their pins are not modelled).
# VERIFY: HDMI input and output, audio codec ADAU1761 (headphone out, line in), USB host,
#         Gigabit Ethernet, microSD, USB-UART, QSPI.
#
# `pin_status` is surfaced by `zynqsim inspect` and the MCP `status_get` tool.

schema_version = 1
name = "pynq-z2"
display_name = "TUL PYNQ-Z2"
part = "xc7z020clg400-1"
ddr_mb = 512               # VERIFY
pl_clock_hz = 125000000    # VERIFY: 125 MHz PL clock
ps_clock_hz = 50000000     # VERIFY: 50 MHz PS clock
pin_status = "unverified"

[layout]
width = 1000
height = 640

# VERIFY: XC7Z020 resources (Zynq-7000 datasheet DS190), from memory.
[resources]
luts = 53200
flip_flops = 106400
bram_36k = 140
dsp_slices = 220

# --- slide switches (PL) -----------------------------------------------------
[[switches]]
id = "sw0"
pin = "M20"
key = "1"
x = 160
y = 585

[[switches]]
id = "sw1"
pin = "M19"
key = "2"
x = 230
y = 585

# --- push buttons (PL) -------------------------------------------------------
[[buttons]]
id = "btn0"
pin = "D19"
key = "Q"
x = 640
y = 585

[[buttons]]
id = "btn1"
pin = "D20"
key = "W"
x = 710
y = 585

[[buttons]]
id = "btn2"
pin = "L20"
key = "E"
x = 780
y = 585

[[buttons]]
id = "btn3"
pin = "L19"
key = "R"
x = 850
y = 585

# --- user LEDs (PL) ----------------------------------------------------------
[[leds]]
id = "led0"
pin = "R14"
color = "green"
x = 160
y = 515

[[leds]]
id = "led1"
pin = "P14"
color = "green"
x = 230
y = 515

[[leds]]
id = "led2"
pin = "N16"
color = "green"
x = 300
y = 515

[[leds]]
id = "led3"
pin = "M14"
color = "green"
x = 370
y = 515

# --- RGB LEDs LD4 and LD5 (PL, PWM driven) -----------------------------------
[[rgb_leds]]
id = "led4"
pin_r = "N15"
pin_g = "G17"
pin_b = "L15"
x = 470
y = 515

[[rgb_leds]]
id = "led5"
pin_r = "M15"
pin_g = "L14"
pin_b = "G14"
x = 530
y = 515

# --- Pmod ports (PL) ------------------------------------------------------------
# Signal pins are named <id>1..4 and <id>7..10 as on a standard 12-pin Pmod; their
# package pins are not listed.
[[pmods]]
id = "PMODA"
domain = "pl"
x = 120
y = 46

[[pmods]]
id = "PMODB"
domain = "pl"
x = 280
y = 46

