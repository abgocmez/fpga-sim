# ZedBoard (Avnet / Digilent, XC7Z020-1CLG484C) board description.
#
# Layout coordinates are in a 1000 x 640 drawing space, origin top-left, y down.
# Every entry's x,y is its CENTRE. The drawing is schematic and NOT to scale; it
# is not a photograph of the physical board layout.
#
# EVERYTHING in this file is from memory of the ZedBoard Hardware User Guide and
# the Digilent/Avnet ZedBoard master XDC; none of it has been checked against the
# documents. Marked individually where it matters:
#
# VERIFY: part and package (xc7z020clg484-1, "CLG484" rather than the Zybo's CLG400).
# VERIFY: 512 MB DDR3 (ddr_mb = 512), 100 MHz PL oscillator (GCLK, pin Y9),
#         33.33 MHz PS clock.
# VERIFY: 8 slide switches (SW0..SW7), 8 PL user LEDs (LD0..LD7), 5 PL push buttons
#         (BTNC, BTND, BTNL, BTNR, BTNU) and every package pin below.
# VERIFY: the "7 push buttons" count: the two extra buttons are modelled as the PS MIO
#         buttons (pin names MIO50 and MIO51). On the real board they are wired to
#         the PS, not to the PL; the simulator forwards all seven to the PL testbench
#         (`tel_ctrl` button bits 5 and 6) because the interface does not know the
#         difference. A PS-side (MIO GPIO) model does not exist.
# VERIFY: the ninth, PS-only LED (LD9 on MIO7) is not modelled.
# VERIFY: Pmod ports JA..JD on the PL; a fifth, PS-side Pmod (JE) is not modelled.
# VERIFY: the OLED (UG-2832HSWEG04, 128 x 32, SSD1306, SPI) is wired to PL pins on
#         this board, not to PS MIO/EMIO. It is drawn only: no model drives it yet.
# VERIFY: HDMI TX only (ADV7511), VGA (12 bit), audio codec ADAU1761 (line in, line
#         out, headphone, mic), Gigabit Ethernet, USB OTG, USB-UART, SD slot, FMC LPC.
#
# `pin_status` is surfaced by `zynqsim inspect` and the MCP `status_get` tool.

schema_version = 1
name = "zedboard"
display_name = "ZedBoard"
part = "xc7z020clg484-1"
ddr_mb = 512               # VERIFY
pl_clock_hz = 100000000    # VERIFY: 100 MHz PL oscillator
ps_clock_hz = 33333333     # VERIFY: 33.33 MHz PS clock
pin_status = "unverified"

[layout]
width = 1000
height = 640

# VERIFY: XC7Z020 resources (Zynq-7000 datasheet DS190), from memory.
[resources]
luts = 53200
flip_flops = 106400
bram_36k = 140
dsp_slices = 220

