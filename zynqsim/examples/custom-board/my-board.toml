# A custom board: a small made-up lab board with 3 switches, 2 buttons, 6 LEDs, one RGB LED
# and one Pmod, drawn over `my-board.svg`. Select it from a project with
#
#   [board]
#   file = "my-board.toml"
#
# The format is documented in the README ("Custom boards") and docs/adr/022-custom-boards.md.
# Pin numbers here are invented; this board does not exist.
schema_version = 1
name = "lab-board"
display_name = "Lab board (example)"
part = "xc7z020clg400-1"
ddr_mb = 512
pl_clock_hz = 100000000
ps_clock_hz = 33333333
pin_status = "unverified"
svg = "my-board.svg"          # optional artwork behind the controls, relative to this file

