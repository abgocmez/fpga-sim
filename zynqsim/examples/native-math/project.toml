# The math firmware of examples/math-qemu on the native PS (ADR-035): no Xilinx QEMU, no
# XSim. The PL is the prototype's `my_math_ip` RTL (fixtures/rtl/math), simulated by the
# native RTL engine (backends.pl = "rtl-native", ADR-034) and served on M_AXI_GP0.
#
#   zynqsim run --project examples/native-math/project.toml --for 2ms
#   expect the same UART text as examples/math-qemu ("ALL PASS" for its 7 vector tests)
schema_version = 1

[board]
name = "zybo-z7-20"

[backends]
ps = "native"
pl = "rtl-native"

[sim]
quantum_ns = 1000

[boot]
mode = "elf"

[cpu0]
elf = "../../fixtures/elf/math_test.elf"

[rtl]
files = ["../../fixtures/rtl/math/my_math_ip.v"]
top = "my_math_ip"

[connect]
"my_math_ip.S_AXI" = "M_AXI_GP0@0x43C00000"
