# Xilinx IP without any RTL: AXI GPIO (LEDs, switches, buttons), AXI Timer and AXI UART Lite run
# as vendor-ip models (crates/vendor-ip) on the native PL. The same design as a Vivado handoff is
# fixtures/xsa/zs_vendor_ip.xsa (fixtures/xsa/make_vendor_xsa.tcl); `zynqsim init --xsa` makes
# this file from it.
#
# Firmware: firmware/gpio_timer_uart (Rust, no_std). It walks the LEDs, takes three timer
# interrupts, sends a greeting through the UART Lite, then mirrors the switches onto the LEDs and
# echoes UART Lite input.
#
#   zynqsim run --project examples/gpio-timer-uart/project.toml --for 6ms
#   expect on UART1: "timer ticks=3", "RESULT: ALL PASS"; uart_read port 2 (the PL's UART Lite):
#   "Hello from AXI UART Lite"; board LEDs follow the switches after that.
#
# Needs: the Xilinx QEMU (Vitis). No Vivado is needed to RUN this.
schema_version = 1

[board]
name = "zybo-z7-20"

[backends]
ps = "qemu"
pl = "native"

[sim]
quantum_ns = 1000
icount_shift = 1

[boot]
mode = "elf"

[cpu0]
elf = "../../fixtures/elf/rust_gpio_timer_uart.elf"

[native]
axi_gpio_0 = "axi_gpio"
axi_gpio_1 = "axi_gpio"
axi_timer_0 = "axi_timer"
axi_uartlite_0 = "axi_uartlite"

[native_params.axi_gpio_0]
C_GPIO_WIDTH = 4
C_ALL_OUTPUTS = 1
ADDRESS_SIZE = "0x10000"

[native_params.axi_gpio_1]
C_IS_DUAL = 1
C_GPIO_WIDTH = 4
C_ALL_INPUTS = 1
C_GPIO2_WIDTH = 4
C_ALL_INPUTS_2 = 1
C_INTERRUPT_PRESENT = 1
ADDRESS_SIZE = "0x10000"

[native_params.axi_timer_0]
C_COUNT_WIDTH = 32
CLK_FREQ_HZ = 100000000
ADDRESS_SIZE = "0x10000"

[native_params.axi_uartlite_0]
C_BAUDRATE = 115200
C_DATA_BITS = 8
C_USE_PARITY = 0
ADDRESS_SIZE = "0x10000"

[connect]
"axi_gpio_0.S_AXI" = "M_AXI_GP0@0x41200000"
"axi_gpio_0.GPIO" = "board.leds"
"axi_gpio_1.S_AXI" = "M_AXI_GP0@0x41210000"
"axi_gpio_1.GPIO" = "board.sw"
"axi_gpio_1.GPIO2" = "board.btn"
"axi_gpio_1.ip2intc_irpt" = "IRQ_F2P[1]"
"axi_timer_0.S_AXI" = "M_AXI_GP0@0x42800000"
"axi_timer_0.interrupt" = "IRQ_F2P[0]"
"axi_uartlite_0.S_AXI" = "M_AXI_GP0@0x40600000"
"axi_uartlite_0.interrupt" = "IRQ_F2P[2]"
