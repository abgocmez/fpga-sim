# Conformance self-test of the PS GPIO (xgpiops, 0xE000A000), written in Rust
# (no_std, armv7a-none-eabi) from ../../firmware/conf_gpiops. Each check prints
# "CHECK n name: PASS|FAIL|N/A why"; "RESULT: ALL PASS" only if no check failed.
# QEMU maps no GPIO at this address, so every register check is N/A (see
# docs/conformance/gpio-timer.md).
#
#   zynqsim run --project examples/conf-gpiops/project.toml --for 20ms
#
# Needs: the Xilinx QEMU (Vitis). No PL and no Vivado.
schema_version = 1

[board]
name = "zybo-z7-20"

[backends]
ps = "qemu"
pl = "demo"          # no PL

[sim]
quantum_ns = 1000
icount_shift = 1

[boot]
mode = "elf"

[cpu0]
elf = "../../fixtures/elf/rust_conf_gpiops.elf"
