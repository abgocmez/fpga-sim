# PS SPI conformance (firmware/conf_spips): register reset values and read/write
# behaviour of SPI0 and SPI1, TX FIFO fill and the TX_FIFO_not_full/full status,
# one manual-start transfer with software chip select, and the RX FIFO after it.
# Prints `CHECK n name: PASS|FAIL|N/A reason` lines and a final `RESULT: ALL PASS`
# on UART1. The conformance table is docs/conformance/iic-spi-xadc.md.
#
#   zynqsim run --project examples/conf-spips/project.toml --for 50ms
#
# Needs only the Xilinx QEMU (Vitis); no Vivado.
schema_version = 1

[board]
name = "zybo-z7-20"

[backends]
ps = "qemu"
pl = "demo"          # no PL

[sim]
quantum_ns = 1000
icount_shift = 1

[boot]
mode = "elf"

[cpu0]
elf = "../../fixtures/elf/rust_conf_spips.elf"
