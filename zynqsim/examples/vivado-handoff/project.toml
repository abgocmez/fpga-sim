# Generated by `zynqsim init --xsa` from design.xsa (design `design_1`, Vivado 2022.1).
# The full inventory, what was mapped and what was not is in xsa-report.md.
# [xsa.unmodelled] entries are validation errors: the run stops with the diagnostic.
schema_version = 1

[board]
name = "zybo-z7-20"

[backends]
ps = "qemu"
pl = "xsim"

[sim]
quantum_ns = 1000
seed = 1
icount_shift = 1

[boot]
mode = "boot_bin"
file = "BOOT.BIN"

[rtl]
files = [
    "../../fixtures/handoff/rtl/my_math_ip.v",
    "tb/cosim_top.sv",
]
top = "cosim_top"
defines = []
waves = false

[connect]
"axi_gpio_0.GPIO" = "board.leds"
"axi_gpio_0.S_AXI" = "M_AXI_GP0@0x41200000"
"axi_gpio_0.s_axi_aclk" = "FCLK_CLK0"
"axi_timer_0.S_AXI" = "M_AXI_GP0@0x42800000"
"axi_timer_0.interrupt" = "IRQ_F2P[0]"
"axi_timer_0.s_axi_aclk" = "FCLK_CLK0"
"axi_uartlite_0.S_AXI" = "M_AXI_GP0@0x40600000"
"axi_uartlite_0.interrupt" = "IRQ_F2P[1]"
"axi_uartlite_0.s_axi_aclk" = "FCLK_CLK0"
"u_math.S_AXI" = "M_AXI_GP0@0x43C00000"
"u_math.S_AXI_ACLK" = "FCLK_CLK0"

[xsa]
source = "../../fixtures/handoff/design.xsa"
report = "xsa-report.md"
unmodelled = []

[devices]

[device_values]

[host]

[native]
axi_gpio_0 = "axi_gpio"
axi_timer_0 = "axi_timer"
axi_uartlite_0 = "axi_uartlite"

[native_params.axi_gpio_0]
ADDRESS_SIZE = "0x10000"
CLK_FREQ_HZ = 100000000
C_ALL_INPUTS = 0
C_ALL_INPUTS_2 = 0
C_ALL_OUTPUTS = 1
C_ALL_OUTPUTS_2 = 0
C_DOUT_DEFAULT = "0x00000000"
C_DOUT_DEFAULT_2 = "0x00000000"
C_GPIO2_WIDTH = 32
C_GPIO_WIDTH = 4
C_INTERRUPT_PRESENT = 0
C_IS_DUAL = 0
C_TRI_DEFAULT = "0xFFFFFFFF"
C_TRI_DEFAULT_2 = "0xFFFFFFFF"

[native_params.axi_timer_0]
ADDRESS_SIZE = "0x10000"
CLK_FREQ_HZ = 100000000
C_COUNT_WIDTH = 32
C_ONE_TIMER_ONLY = 0

[native_params.axi_uartlite_0]
