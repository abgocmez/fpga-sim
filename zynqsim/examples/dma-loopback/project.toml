# AXI DMA loopback with no RTL: the Xilinx IP runs as a vendor-ip model (crates/vendor-ip, ADR-021)
# on the native PL. The same design as a Vivado handoff is fixtures/xsa/zs_dma_loopback.xsa
# (fixtures/xsa/make_dma_xsa.tcl); `zynqsim init --xsa` makes this file from it.
#
# Firmware: firmware/dma_loopback (Rust, no_std). MM2S reads a 1 KiB buffer from DDR through the
# S_AXI_HP0 path, the AXI4-Stream loops back (M_AXIS_MM2S -> S_AXIS_S2MM), S2MM writes it to a
# second buffer; both channels interrupt (IRQ_F2P[0] and [1]). Then a zero-length transfer
# provokes the error interrupt, a soft reset recovers, and a second copy runs.
#
#   zynqsim run --project examples/dma-loopback/project.toml --for 4ms
#   expect on UART1: "copied 1024 bytes, 0 word(s) differ", "zero length: err irq=true", "RESULT: ALL PASS"
#   (the trace shows the DMA's reads and writes as PL master accesses on S_AXI_HP0)
#
# Needs: the Xilinx QEMU (Vitis). No Vivado is needed to RUN this.
schema_version = 1

[board]
name = "zybo-z7-20"

[backends]
ps = "qemu"
pl = "native"

[sim]
quantum_ns = 1000
icount_shift = 1

[boot]
mode = "elf"

[cpu0]
elf = "../../fixtures/elf/rust_dma_loopback.elf"

[native]
axi_dma_0 = "axi_dma"

[native_params.axi_dma_0]
C_INCLUDE_SG = 0
C_SG_LENGTH_WIDTH = 23
CLK_FREQ_HZ = 100000000
PS_PORT = "S_AXI_HP0"
STREAM_LOOPBACK = 1
ADDRESS_SIZE = "0x10000"

[connect]
"axi_dma_0.S_AXI_LITE" = "M_AXI_GP0@0x40400000"
"axi_dma_0.M_AXI_MM2S" = "S_AXI_HP0"
"axi_dma_0.M_AXI_S2MM" = "S_AXI_HP0"
"axi_dma_0.mm2s_introut" = "IRQ_F2P[0]"
"axi_dma_0.s2mm_introut" = "IRQ_F2P[1]"
