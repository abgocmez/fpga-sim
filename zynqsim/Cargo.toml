[workspace]
resolver = "3"
# cargo-fuzz targets need nightly and libFuzzer; they build from their own manifest.
exclude = ["fuzz"]
members = [
    "crates/sim-core",
    "crates/ps-bus",
    "crates/mem-sys",
    "crates/ps-periph",
    "crates/cpu-a9",
    "crates/trace",
    "crates/xsa-import",
    "crates/boot",
    "crates/xsim-export",
    "crates/board-zybo",
    "crates/devices",
    "crates/sim-api",
    "crates/mcp",
    "crates/cli",
    "crates/gui",
    "crates/xtask",
    "crates/interop",
    "crates/pl-api",
    "crates/pl-native",
    "crates/vendor-ip",
    "crates/backend-qemu",
    "crates/xsim-dpi",
    "crates/dpi-cdylib",
    "crates/backend-rtl-xsim",
    "crates/backend-rtl-verilator",
    "crates/rtl-frontend",
    "crates/rtl-engine",
]
default-members = [
    "crates/sim-core",
    "crates/ps-bus",
    "crates/mem-sys",
    "crates/ps-periph",
    "crates/cpu-a9",
    "crates/trace",
    "crates/xsa-import",
    "crates/boot",
    "crates/xsim-export",
    "crates/board-zybo",
    "crates/devices",
    "crates/sim-api",
    "crates/mcp",
    "crates/cli",
    "crates/gui",
    "crates/interop",
    "crates/pl-api",
    "crates/pl-native",
    "crates/vendor-ip",
    "crates/backend-qemu",
    "crates/xsim-dpi",
    "crates/backend-rtl-xsim",
    "crates/backend-rtl-verilator",
    "crates/rtl-frontend",
    "crates/rtl-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://example.invalid/zynqsim"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `xsim-dpi` is a no_std static library that cannot unwind, and cargo takes the
# panic strategy from the workspace profile. Tests always unwind regardless.
[profile.dev]
panic = "abort"

# The native PS engine interprets guest code inside the dev and test profiles (ADR-033). Its
# hot crates are optimised there, so a 100 ms virtual-time run takes seconds, not minutes.
[profile.dev.package.cpu-a9]
opt-level = 3
[profile.dev.package.mem-sys]
opt-level = 3
[profile.dev.package.ps-periph]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
