# Bare-metal Cortex-A9 firmware for the simulator, in Rust (`no_std`).
# A separate workspace: it targets `armv7a-none-eabi`, not the host.
# Build: `cargo xtask firmware` (or `cargo build --release` in this directory).
[workspace]
resolver = "3"
members = ["rt", "hello", "audio_demo", "hdmi_demo", "irq_demo", "oled_demo", "rgb_demo", "tmp2_demo", "als_demo", "acl_demo", "pcam_demo", "net_demo", "sd_demo", "qspi_demo", "debug_demo", "gpio_timer_uart", "vendor_mix", "handoff_demo", "board8_demo", "dma_loopback", "intc_demo", "iic_bram_demo", "dma_sg", "conf_gpiops", "conf_scutimer", "conf_ttc", "conf_dmaps", "conf_iicps", "conf_spips", "conf_xadcps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

# `debug = 1` (line tables and function names, no variables or types) for the
# source-level debugging demo: about 9 KiB of `.debug_*` sections that are not
# loaded. (`line-tables-only` leaves out the function names.) The other demos
# stay without debug info, as the committed fixtures are.
[profile.release.package.debug_demo]
debug = "limited"

[profile.dev]
panic = "abort"
