# Bare-metal Cortex-A9 firmware for the simulator, in Rust (`no_std`).
# A separate workspace: it targets `armv7a-none-eabi`, not the host.
# Build: `cargo xtask firmware` (or `cargo build --release` in this directory).
[workspace]
resolver = "3"
members = ["rt", "hello", "audio_demo", "hdmi_demo", "sd_demo", "qspi_demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
