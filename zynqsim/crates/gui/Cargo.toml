[package]
name = "zynqsim-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cpal = { version = "0.18.2", optional = true }
eframe = { version = "0.32.3", features = ["persistence"] }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sim-api = { version = "0.1.0", path = "../sim-api" }

[dev-dependencies]
# Reads the ELF's `.text` range in the end-to-end tests (already in the lock file via sim-api).
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }

[features]
default = ["audio", "dialogs"]
# Speaker output for the codec (cpal; needs ALSA development files on Linux).
audio = ["dep:cpal"]
# Native file dialogs (rfd; needs GTK 3 development files on Linux).
dialogs = ["dep:rfd"]
