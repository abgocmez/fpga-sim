[package]
name = "zynqsim-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cpal = { version = "0.18.2", optional = true }
eframe = "0.32.3"
rfd = { version = "0.17.2", optional = true }
sim-api = { version = "0.1.0", path = "../sim-api" }

[features]
default = ["audio", "dialogs"]
# Speaker output for the codec (cpal; needs ALSA development files on Linux).
audio = ["dep:cpal"]
# Native file dialogs (rfd; needs GTK 3 development files on Linux).
dialogs = ["dep:rfd"]
