# Runs on GitHub-hosted runners. Everything that needs the Xilinx tools
# (QEMU, Vivado XSim) skips itself there, so this checks the build, lints and
# the tests that do not need them, on three operating systems.
name: ci
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: zynqsim

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
          libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zynqsim
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (freestanding DPI library)
        run: cargo clippy -p xsim-dpi --features freestanding -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: release build (zynqsim, zynqsim-gui, zynqsim-mcp)
        run: cargo build --release
