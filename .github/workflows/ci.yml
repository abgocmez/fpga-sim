# Runs on GitHub-hosted runners. Everything that needs the Xilinx tools
# (QEMU, Vivado XSim) skips itself there, so this checks the build, lints and
# the tests that do not need them.
#
# Minutes are billed 1x on Linux, 2x on Windows and 10x on macOS, and the free
# quota (2000 min) ran out with the full matrix on every push of a stack of
# pull requests. So: pull requests run Linux only; the three-OS matrix runs on
# pushes to main and on demand (Actions tab > ci > Run workflow); a newer push
# to the same ref cancels the older run; documentation-only changes skip it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "zynqsim/docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: zynqsim

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev
          libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zynqsim
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (freestanding DPI library)
        run: cargo clippy -p xsim-dpi --features freestanding -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: release build (zynqsim, zynqsim-gui, zynqsim-mcp)
        if: github.event_name != 'pull_request'
        run: cargo build --release
